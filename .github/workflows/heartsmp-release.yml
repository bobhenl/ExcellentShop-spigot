name: HeartSMP release

# Daily: merge upstream nulli0n/ExcellentShop-spigot into master. On any new commit
# (upstream or ours) build the plugin and publish a versioned release for AutoUpdatePlugins.
on:
  push:
    branches: [ "master" ]
    paths-ignore: [ ".github/**", "**.md" ]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Merge upstream
        id: sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/nulli0n/ExcellentShop-spigot.git
          git fetch upstream master
          BEFORE=$(git rev-parse HEAD)
          if ! git merge --no-edit upstream/master; then
            echo "::error::Upstream merge has conflicts, resolve them by hand."
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "$BEFORE" ]; then
            git push origin HEAD:master
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip when nothing changed
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ steps.sync.outputs.changed }}" != "true" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v5
        if: steps.gate.outputs.build == 'true'
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: Build
        if: steps.gate.outputs.build == 'true'
        run: mvn -B -U -DskipTests clean package

      - name: Publish release
        if: steps.gate.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls target/ExcellentShop-*.jar | head -n 1)
          test -n "$JAR" || { echo "No plugin jar found"; ls -l target; exit 1; }
          BASE=$(basename "$JAR" .jar | sed 's/^ExcellentShop-//')
          VER="${BASE}-heartsmp${{ github.run_number }}"
          cp "$JAR" "ExcellentShop-${VER}.jar"
          gh release create "$VER" "ExcellentShop-${VER}.jar" --repo "$GITHUB_REPOSITORY" \
            --target "$(git rev-parse HEAD)" \
            --title "ExcellentShop $VER" \
            --notes "Upstream ${BASE} + HeartSMP world group banks. Commit $(git rev-parse --short HEAD)."
